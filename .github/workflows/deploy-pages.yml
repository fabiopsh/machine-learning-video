name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "videolezioni/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies (Pillow, ffmpeg, DejaVu fonts)
        run: |
          python -m pip install --upgrade pip pillow
          if ! command -v ffmpeg >/dev/null 2>&1 || [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          fi

      - name: Build static Pages bundle (clean URLs, OG covers, MP3 audio)
        run: |
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          python videolezioni/scripts/build_pages.py \
            --base-url "$BASE_URL" \
            --out "_site" \
            --transcode-mp3 \
            --require-ffmpeg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
